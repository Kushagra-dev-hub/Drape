<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#fdfcff;-webkit-font-smoothing:antialiased}
a{color:#6842c2;text-decoration:none}a:hover{color:#4f2fa3}
input::placeholder{color:#a79ebb}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7) rotate(0deg)}50%{opacity:.7;transform:scale(1) rotate(25deg)}}
@keyframes drift{from{translate:0 0}to{translate:14px -22px}}
</style>
</helmet>
<div data-screen-label="Login" style="display:flex;width:100%;min-height:100vh;background:#fdfcff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#241b3d;overflow:hidden">

  <div style="position:relative;width:25%;min-width:320px;max-width:430px;overflow:hidden;background:linear-gradient(168deg,#cdb8f0 0%,#b295e4 52%,#9573d4 100%)">
    <div style="position:absolute;left:-30%;top:-14%;width:160%;height:70%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.5),rgba(255,255,255,0))"></div>
    <div style="position:absolute;left:50%;top:52%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;border:1px solid rgba(255,255,255,.42)"></div>
    <div style="position:absolute;left:50%;top:52%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;border:1px solid rgba(255,255,255,.3)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,rgba(96,63,158,0),rgba(84,52,143,.3))"></div>

    <div style="position:absolute;left:14%;top:22%;width:26px;height:26px;background:radial-gradient(closest-side,#fff,#cbb4f2);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);animation:twinkle 3.6s ease-in-out infinite,drift 11s ease-in-out infinite alternate"></div>
    <div style="position:absolute;left:76%;top:16%;width:18px;height:18px;background:radial-gradient(closest-side,#fff,#d3bef5);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);animation:twinkle 4.4s ease-in-out .8s infinite,drift 13s ease-in-out 1s infinite alternate"></div>
    <div style="position:absolute;left:8%;top:58%;width:14px;height:14px;background:radial-gradient(closest-side,#fff,#c7aff0);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);animation:twinkle 5.2s ease-in-out 1.6s infinite,drift 15s ease-in-out infinite alternate"></div>
    <div style="position:absolute;left:82%;top:64%;width:22px;height:22px;background:radial-gradient(closest-side,#fff,#cdb7f3);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);animation:twinkle 4.1s ease-in-out .4s infinite,drift 12s ease-in-out 2s infinite alternate"></div>
    <div style="position:absolute;left:30%;top:11%;width:12px;height:12px;background:radial-gradient(closest-side,#fff,#d8c6f7);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);animation:twinkle 3.2s ease-in-out 2.1s infinite,drift 10s ease-in-out infinite alternate"></div>
    <div style="position:absolute;left:66%;top:80%;width:16px;height:16px;background:radial-gradient(closest-side,#fff,#c9b1f1);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);animation:twinkle 4.8s ease-in-out 1.1s infinite,drift 14s ease-in-out .5s infinite alternate"></div>

    <div ref="{{ refAura }}" style="position:absolute;left:50%;top:50%;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.92),rgba(233,222,252,.42) 52%,rgba(233,222,252,0) 74%);opacity:.6"></div>

    <div style="position:absolute;left:50%;top:50%;width:332px;height:546px;margin:-286px 0 0 -166px">
      <div ref="{{ refScale }}" style="width:332px;height:546px;transform-origin:50% 50%;transform:scale(.74)">
        <div ref="{{ refShadow }}" style="position:absolute;left:50%;top:534px;width:240px;height:36px;margin-left:-120px;border-radius:50%;background:radial-gradient(closest-side,rgba(69,38,124,.62),rgba(69,38,124,0))"></div>
        <div ref="{{ refStage }}" style="position:absolute;inset:0">
          <div ref="{{ refBody }}" style="position:absolute;inset:0;transform-origin:166px 546px;filter:saturate(1.22) contrast(1.05) drop-shadow(0 16px 26px rgba(74,44,128,.3))">
            <img ref="{{ refArm }}" src="rig/arm.png" alt="" style="position:absolute;left:0;top:318.6px;width:81px;height:172.8px;transform-origin:64.8px 24.3px">
            <img src="rig/base.png" alt="Mascot companion" style="position:absolute;left:0;top:0;width:332.1px;height:545.4px">
            <div ref="{{ refFeats }}" style="position:absolute;inset:0">
              <div ref="{{ refEyeLBox }}" style="position:absolute;left:20.25px;top:203.85px;width:32.4px;height:70.2px">
                <div ref="{{ refEyeL }}" style="position:absolute;inset:0;border-radius:50%;background:linear-gradient(178deg,#1a1338 0%,#0a0718 42%,#3a2a63 76%,#9d75cb 100%);transform-origin:50% 50%">
                  <div style="position:absolute;left:16%;top:12%;width:36%;height:24%;border-radius:50%;background:#fff;opacity:.95"></div>
                  <div style="position:absolute;left:52%;top:66%;width:26%;height:16%;border-radius:50%;background:#e7d8ff;opacity:.4"></div>
                </div>
                <svg ref="{{ refArcL }}" viewBox="0 0 12 26" style="position:absolute;inset:0;width:100%;height:100%;opacity:0"><path d="M1.4 15.4 Q6 8.4 10.6 15.4" fill="none" stroke="#241a48" stroke-width="2.3" stroke-linecap="round"></path></svg>
              </div>
              <div ref="{{ refEyeRBox }}" style="position:absolute;left:133.65px;top:201.15px;width:54px;height:75.6px">
                <div ref="{{ refEyeR }}" style="position:absolute;inset:0;border-radius:50%;background:linear-gradient(178deg,#1a1338 0%,#0a0718 42%,#3a2a63 76%,#9d75cb 100%);transform-origin:50% 50%">
                  <div style="position:absolute;left:15%;top:11%;width:34%;height:23%;border-radius:50%;background:#fff;opacity:.95"></div>
                  <div style="position:absolute;left:54%;top:68%;width:24%;height:15%;border-radius:50%;background:#e7d8ff;opacity:.4"></div>
                </div>
                <svg ref="{{ refArcR }}" viewBox="0 0 20 28" style="position:absolute;inset:0;width:100%;height:100%;opacity:0"><path d="M2 16.4 Q10 7.6 18 16.4" fill="none" stroke="#241a48" stroke-width="2.5" stroke-linecap="round"></path></svg>
              </div>
              <svg viewBox="0 0 16 12" style="position:absolute;left:70.2px;top:261.9px;width:43.2px;height:32.4px;overflow:visible">
                <path ref="{{ refM0 }}" d="M1.2 4.1 Q8 9.7 14.8 3.7" fill="none" stroke="#bda7d6" stroke-width="1.5" stroke-linecap="round"></path>
                <path ref="{{ refM1 }}" d="M1.4 3.5 Q8 11.6 14.6 3.1 Q8 6.3 1.4 3.5 Z" fill="#a07dc6" opacity="0"></path>
                <ellipse ref="{{ refM2 }}" cx="8" cy="5.6" rx="1.9" ry="2.4" fill="#ab8bce" opacity="0"></ellipse>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div ref="{{ refBurst }}" style="position:absolute;left:50%;top:44%;width:0;height:0">
      <div style="position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;background:radial-gradient(closest-side,#fff,#c4a8f0);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);opacity:0"></div>
      <div style="position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;background:radial-gradient(closest-side,#fff,#c4a8f0);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);opacity:0"></div>
      <div style="position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;background:radial-gradient(closest-side,#fff,#c4a8f0);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);opacity:0"></div>
      <div style="position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;background:radial-gradient(closest-side,#fff,#c4a8f0);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);opacity:0"></div>
      <div style="position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;background:radial-gradient(closest-side,#fff,#c4a8f0);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);opacity:0"></div>
      <div style="position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;background:radial-gradient(closest-side,#fff,#c4a8f0);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);opacity:0"></div>
    </div>

    <sc-if value="{{ showCaption }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:0;right:0;bottom:38px;display:flex;justify-content:center">
        <div ref="{{ refCap }}" style="font-family:Quicksand,system-ui,sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#f0e7ff;transition:opacity .3s ease">floating</div>
      </div>
    </sc-if>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:48px;border-left:1px solid #efe9f9">
    <div style="width:100%;max-width:392px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:42px">
        <div style="width:22px;height:22px;background:linear-gradient(150deg,#8b62dd,#5f3bb8);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)"></div>
        <div style="font-size:15px;font-weight:700;letter-spacing:-.01em">Aster</div>
      </div>

      <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:18px">
          <div style="width:44px;height:44px;border-radius:50%;background:#eef8f2;display:flex;align-items:center;justify-content:center">
            <svg viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M5 12.6 L10 17.4 L19 7.2" fill="none" stroke="#3f8f6d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </div>
          <div>
            <div style="font-size:29px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px">You're in</div>
            <div style="font-size:15px;line-height:1.6;color:#6f6486">Taking you to your workspace. Pip will be waiting in the corner.</div>
          </div>
          <button type="button" onClick="{{ onReset }}" style="align-self:flex-start;margin-top:8px;padding:10px 16px;border:1px solid #e6e0f2;border-radius:10px;background:#fff;font-family:inherit;font-size:13.5px;font-weight:600;color:#6f6486;cursor:pointer" style-hover="border-color:#cdbdee;color:#4f2fa3">Run the demo again</button>
        </div>
      </sc-if>

      <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{ onSubmit }}">
          <div style="font-size:31px;font-weight:600;letter-spacing:-.025em;margin-bottom:9px">Welcome back</div>
          <div style="font-size:15px;line-height:1.6;color:#6f6486;margin-bottom:34px">Sign in to continue to your workspace.</div>

          <div style="display:flex;flex-direction:column;gap:18px">
            <div>
              <div style="font-size:12.5px;font-weight:600;letter-spacing:.02em;color:#6f6486;margin-bottom:7px">Email</div>
              <input type="email" autoComplete="off" placeholder="you@company.com" value="{{ email }}" onChange="{{ onEmail }}" onFocus="{{ onFocusEmail }}" onBlur="{{ onBlur }}" style="width:100%;box-sizing:border-box;height:48px;padding:0 14px;border:1px solid #e6e0f2;border-radius:12px;background:#fff;font-family:inherit;font-size:15px;color:#241b3d;outline:none;transition:border-color .18s ease,box-shadow .18s ease" style-focus="border-color:#8b62dd;box-shadow:0 0 0 4px rgba(139,98,221,.13)">
            </div>

            <div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px">
                <div style="font-size:12.5px;font-weight:600;letter-spacing:.02em;color:#6f6486">Password</div>
                <a href="#reset" style="font-size:12.5px;font-weight:600;color:#8b62dd">Forgot?</a>
              </div>
              <div style="position:relative">
                <input type="{{ pwType }}" autoComplete="off" placeholder="••••••••" value="{{ pw }}" onChange="{{ onPw }}" onFocus="{{ onFocusPw }}" onBlur="{{ onBlur }}" style="width:100%;box-sizing:border-box;height:48px;padding:0 62px 0 14px;border:1px solid #e6e0f2;border-radius:12px;background:#fff;font-family:inherit;font-size:15px;color:#241b3d;outline:none;transition:border-color .18s ease,box-shadow .18s ease" style-focus="border-color:#8b62dd;box-shadow:0 0 0 4px rgba(139,98,221,.13)">
                <button type="button" onClick="{{ onToggle }}" style="position:absolute;right:6px;top:6px;height:36px;padding:0 10px;border:0;border-radius:9px;background:transparent;font-family:inherit;font-size:12.5px;font-weight:600;color:#8c81a3;cursor:pointer" style-hover="background:#f5f1fd;color:#6842c2">{{ pwToggle }}</button>
              </div>
            </div>

            <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;gap:8px;align-items:flex-start;padding:11px 13px;border-radius:11px;background:#fdf2f4;font-size:13.5px;line-height:1.5;color:#a34158">
                <div style="width:5px;height:5px;border-radius:50%;background:#c4536b;margin-top:7px;flex:none"></div>
                <div>{{ err }}</div>
              </div>
            </sc-if>

            <button type="submit" onMouseEnter="{{ onHover }}" onMouseLeave="{{ onUnhover }}" disabled="{{ busy }}" style="height:50px;margin-top:4px;border:0;border-radius:12px;background:linear-gradient(180deg,#7c56d3,#6842c2);color:#fff;font-family:inherit;font-size:15.5px;font-weight:600;letter-spacing:-.01em;cursor:pointer;box-shadow:0 8px 20px rgba(104,66,194,.26);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease" style-hover="transform:translateY(-1px);filter:brightness(1.07);box-shadow:0 12px 26px rgba(104,66,194,.32)" style-active="transform:translateY(1px)">{{ cta }}</button>
          </div>

          <div style="margin-top:26px;font-size:13.5px;color:#8c81a3">New to Aster? <a href="#signup" style="font-weight:600">Create an account</a></div>
          <div style="margin-top:30px;padding-top:18px;border-top:1px solid #f2edfb;font-size:12px;line-height:1.6;color:#a79ebb">Demo: any email, and a password of 8+ characters signs you in.</div>
        </form>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showCaption&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Companion&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:1.6,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Companion&quot;},&quot;mascotScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.7,&quot;max&quot;:1.2,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Companion&quot;}}">
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
const ease = (t) => t * t * (3 - 2 * t);
const arcE = (t) => Math.sin(Math.PI * clamp(t, 0, 1));

// live interaction state — read by the animation loop, written by the form handlers
const UI = { focus: null, hover: false, phase: 'idle', at: 0, key: -9 };

const CAPTION = {
  idle: 'floating', email: 'watching along', typing: 'watching along',
  password: 'not looking', hover: 'ready when you are',
  submit: 'checking', success: 'welcome back', error: "let's try again",
};

class Component extends DCLogic {
  constructor(...a) {
    super(...a);
    this.state = { email: '', pw: '', show: false, busy: false, err: '', signedIn: false };
    UI.focus = null; UI.hover = false; UI.phase = 'idle'; UI.at = 0;
    this.r = {};
    this._cb = {};
    this.a = { rot: 0, fx: 0, fy: 0, gx: 0, gy: 0, open: 1, arc: 0, lift: 0, arm: 0, aura: 0, wide: 0, m0: 1, m1: 0, m2: 0 };
    this.v = {};
    this.blinkNext = 2.2; this.blinkAt = -9; this.lastKey = -9; this.phaseAt = 0; this.burst = 0;
  }

  ref(k) { return this._cb[k] || (this._cb[k] = (el) => { this.r[k] = el; }); }
  now() { return performance.now() / 1000; }

  componentDidMount() {
    this.mounted = true;
    this.lastFrame = 0;
    const loop = () => {
      if (!this.mounted) return;
      this.lastFrame = this.now();
      this.tick(this.lastFrame);
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
    // keeps the companion alive if rAF is throttled (background tab, embedded frame)
    this.iv = setInterval(() => {
      if (this.mounted && this.now() - this.lastFrame > 0.12) this.tick(this.now());
    }, 33);
  }
  componentWillUnmount() { this.mounted = false; cancelAnimationFrame(this.raf); clearInterval(this.iv); }

  step(k, target, kp, d) {
    const v = (this.v[k] || 0) + (target - this.a[k]) * kp;
    this.v[k] = v * d;
    this.a[k] += this.v[k];
  }

  mode() {
    if (UI.phase !== 'idle') return UI.phase;
    if (UI.focus === 'password') return 'password';
    if (UI.focus === 'email') return this.now() - UI.key < 1.1 ? 'typing' : 'email';
    if (UI.hover) return 'hover';
    return 'idle';
  }

  // one pose per state; springs do all the easing, lag and overlap
  pose(m) {
    switch (m) {
      case 'submit':   return { rot: 1.4, fx: 1, fy: -1, gx: 0, gy: -1, open: 1.14, arc: 0, wide: 1, mouth: 1 };
      case 'success':  return { rot: 0, fx: 0, fy: -1, gx: 0, gy: 0, open: 1, arc: 1, wide: 1, mouth: 1 };
      case 'error':    return { rot: -3.6, fx: 2, fy: 0, gx: 2, gy: 1.5, open: 1.07, arc: 0, wide: .5, mouth: 2 };
      case 'password': return { rot: -3, fx: -7, fy: -1.5, gx: -4, gy: -2, open: 1, arc: 1, wide: 0, mouth: 0 };
      case 'typing':
      case 'email':    return { rot: 2.4, fx: 5, fy: 1, gx: 4, gy: 3.5, open: 1, arc: 0, wide: 0, mouth: 0 };
      case 'hover':    return { rot: 3.6, fx: 4, fy: 2, gx: 3, gy: 2, open: 1, arc: 0, wide: .3, mouth: 0 };
      default:         return { rot: 0, fx: 0, fy: 0, gx: 0, gy: 0, open: 1, arc: 0, wide: 0, mouth: 0 };
    }
  }

  tick(t) {
    const R = this.r, a = this.a, M = this.mode(), p = this.pose(M);
    const amp = clamp(this.props.motion ?? 1, 0, 2);
    const pt = t - UI.at;

    // ambient life: float, breath, sway — different periods so nothing lands together
    const float = Math.sin(t * 2 * Math.PI / 4.6);
    const breath = Math.sin(t * 2 * Math.PI / 3.1);
    const sway = Math.sin(t * 2 * Math.PI / 7.3);

    // event overlays
    let hop = 0, armT = 0;
    if (M === 'submit') hop = arcE(seg(pt, 0, .55)) * 26;
    if (M === 'success') {
      hop = arcE(seg(pt, .05, .5)) * 30 + arcE(seg(pt, .52, .95)) * 16;
      const up = ease(seg(pt, .5, .72)) * (1 - ease(seg(pt, 1.5, 1.75)));
      armT = 112 * up + Math.sin(seg(pt, .68, 1.6) * Math.PI * 6) * 15 * up;
    }
    if (M === 'error' && pt < .5) this.blinkAt = this.blinkAt < t - .4 ? t : this.blinkAt;

    // typing micro-adjustments
    const typing = M === 'typing' ? clamp(1.1 - (t - UI.key), 0, 1) : 0;
    const jitter = typing * Math.sin(t * 9.1) * 1.4;

    this.step('rot', p.rot + sway * .5 * amp, .09, .8);
    this.step('fx', p.fx * amp + jitter, .12, .78);
    this.step('fy', p.fy * amp + typing * Math.sin(t * 6.3) * .8, .13, .76);
    this.step('gx', p.gx * amp, .16, .74);
    this.step('gy', p.gy * amp, .16, .74);
    this.step('arc', p.arc, .14, .72);
    this.step('wide', p.wide, .1, .8);
    this.step('arm', armT, .22, .62);
    this.step('lift', hop, .3, .55);
    this.step('m0', p.mouth === 0 ? 1 : 0, .18, .7);
    this.step('m1', p.mouth === 1 ? 1 : 0, .18, .7);
    this.step('m2', p.mouth === 2 ? 1 : 0, .18, .7);

    // blinking: random cadence, suppressed while the eyes are already closed
    if (a.arc < .5 && t > this.blinkNext) { this.blinkAt = t; this.blinkNext = t + 2.4 + Math.random() * 4.2; }
    const bl = seg(t - this.blinkAt, 0, .17);
    const blink = this.blinkAt > 0 && bl < 1 ? 1 - Math.sin(Math.PI * bl) * .94 : 1;
    const openY = (p.open + a.wide * .06) * blink * (1 - a.arc * .92);

    // burst sparkles fire on submit and success
    const bTarget = (M === 'submit' ? arcE(seg(pt, .05, .9)) : M === 'success' ? arcE(seg(pt, .1, 1.7)) : 0);
    this.burst += (bTarget - this.burst) * .18;

    const lift = a.lift + float * 7 * amp;
    if (R.stage) R.stage.style.transform = 'translateY(' + (-lift) + 'px)';
    // the rig is mirrored so the mascot faces the form; pose values stay in "toward the form" terms
    if (R.body) R.body.style.transform = 'rotate(' + (-a.rot) + 'deg) scale(' + (-(1 - .007 * breath)) + ',' + (1 + .009 * breath) + ')';
    if (R.arm) R.arm.style.transform = 'rotate(' + a.arm + 'deg)';
    if (R.feats) R.feats.style.transform = 'translate(' + (-a.fx) + 'px,' + (a.fy + lift * .04) + 'px)';
    if (R.scale) R.scale.style.transform = 'scale(' + (.74 * clamp(this.props.mascotScale ?? 1, .5, 1.3)) + ')';

    const gaze = 'translate(' + (-a.gx) + 'px,' + a.gy + 'px)';
    if (R.eyeLBox) R.eyeLBox.style.transform = gaze;
    if (R.eyeRBox) R.eyeRBox.style.transform = gaze;
    const eyeT = 'scale(' + (1 + a.wide * .04) + ',' + clamp(openY, .02, 1.2) + ')';
    if (R.eyeL) { R.eyeL.style.transform = eyeT; R.eyeL.style.opacity = 1 - a.arc; }
    if (R.eyeR) { R.eyeR.style.transform = eyeT; R.eyeR.style.opacity = 1 - a.arc; }
    if (R.arcL) R.arcL.style.opacity = a.arc;
    if (R.arcR) R.arcR.style.opacity = a.arc;
    if (R.m0) R.m0.style.opacity = a.m0;
    if (R.m1) R.m1.style.opacity = a.m1;
    if (R.m2) R.m2.style.opacity = a.m2;

    if (R.shadow) {
      R.shadow.style.opacity = .26 - lift * .003;
      R.shadow.style.transform = 'scale(' + (1 - lift * .0045) + ')';
    }
    if (R.aura) { // lags the float, so it never stops with the body
      this.step('aura', lift, .06, .82);
      R.aura.style.transform = 'translateY(' + (-a.aura * .5) + 'px) scale(' + (1 + a.aura * .0016 + this.burst * .05) + ')';
      R.aura.style.opacity = .42 + this.burst * .3 + Math.abs(float) * .06;
    }
    if (R.burst) {
      const kids = R.burst.children;
      for (let i = 0; i < kids.length; i++) {
        const ang = (i / kids.length) * Math.PI * 2 + .6;
        const rad = 74 + 96 * this.burst;
        kids[i].style.transform = 'translate(' + Math.cos(ang) * rad + 'px,' + Math.sin(ang) * rad * .8 + 'px) rotate(' + (i * 30 + this.burst * 60) + 'deg) scale(' + (.5 + this.burst * .7) + ')';
        kids[i].style.opacity = this.burst * .95;
      }
    }
    if (R.cap) {
      const want = CAPTION[M] || 'floating';
      if (this._cap !== want) { this._cap = want; R.cap.textContent = want; }
    }
  }

  setPhase(phase, ms, then) {
    UI.phase = phase;
    UI.at = this.now();
    const busy = phase === 'submit';
    if (this.state.busy !== busy) this.setState({ busy });
    clearTimeout(this._pt);
    if (ms) this._pt = setTimeout(() => { if (this.mounted) then(); }, ms);
  }

  submit = (e) => {
    e.preventDefault();
    if (UI.phase === 'submit') return;
    const { email, pw } = this.state;
    this.setState({ err: '' });
    this.setPhase('submit', 1000, () => {
      if (!email.trim()) return this.fail('Add your email address to continue.');
      if (pw.length < 8) return this.fail(pw ? 'That password didn’t match. Try again?' : 'Enter your password to continue.');
      this.setPhase('success', 700, () => {
        this.setState({ signedIn: true });
        clearTimeout(this._pt2);
        this._pt2 = setTimeout(() => { if (this.mounted) this.setPhase('idle'); }, 1200);
      });
    });
  };

  fail = (err) => {
    this.setState({ err });
    this.setPhase('error', 1400, () => this.setPhase('idle'));
  };

  renderVals() {
    const s = this.state;
    return {
      email: s.email, pw: s.pw, err: s.err,
      hasError: !!s.err, busy: !!s.busy,
      signedIn: s.signedIn, signedOut: !s.signedIn,
      cta: s.busy ? 'Signing in…' : 'Log in',
      pwType: s.show ? 'text' : 'password',
      pwToggle: s.show ? 'Hide' : 'Show',
      showCaption: this.props.showCaption ?? true,
      refStage: this.ref('stage'), refBody: this.ref('body'), refArm: this.ref('arm'),
      refFeats: this.ref('feats'), refScale: this.ref('scale'),
      refEyeL: this.ref('eyeL'), refEyeR: this.ref('eyeR'),
      refEyeLBox: this.ref('eyeLBox'), refEyeRBox: this.ref('eyeRBox'),
      refArcL: this.ref('arcL'), refArcR: this.ref('arcR'),
      refM0: this.ref('m0'), refM1: this.ref('m1'), refM2: this.ref('m2'),
      refAura: this.ref('aura'), refShadow: this.ref('shadow'),
      refBurst: this.ref('burst'), refCap: this.ref('cap'),
      onEmail: (e) => { UI.key = this.now(); this.setState({ email: e.target.value }); },
      onPw: (e) => { UI.key = this.now(); this.setState({ pw: e.target.value }); },
      onFocusEmail: () => { UI.focus = 'email'; },
      onFocusPw: () => { UI.focus = 'password'; },
      onBlur: () => { UI.focus = null; },
      onHover: () => { UI.hover = true; },
      onUnhover: () => { UI.hover = false; },
      onToggle: () => this.setState({ show: !s.show }),
      onSubmit: this.submit,
      onReset: () => { this.setState({ signedIn: false, email: '', pw: '', err: '', show: false }); this.setPhase('idle'); },
    };
  }
}
</script>
</body>
</html>
