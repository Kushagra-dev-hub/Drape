<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VoiceMascot demo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#f6f2fc;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  #root{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
  .panel{position:relative;overflow:hidden;width:860px;max-width:100%;border-radius:32px;
         background:linear-gradient(168deg,#f8eeff 0%,#f0d9ff 48%,#e7cbfb 100%);
         box-shadow:0 40px 90px -40px rgba(74,44,128,.45),0 0 0 1px rgba(151,116,206,.16);
         padding:34px 40px 30px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .chips{display:flex;gap:7px}
  .chips button{padding:8px 14px;border:0;border-radius:11px;font:700 12.5px 'Plus Jakarta Sans',sans-serif;
                cursor:pointer;background:rgba(255,255,255,.72);color:#7a67a3}
  .chips button[data-on="1"]{background:#7b52c9;color:#fff}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="./VoiceMascot.jsx"></script>
<script>
// Demo conversation. In your app, replace this with your STT/TTS events.
var SCRIPT = [
  { s:'listening', t:'What\u2019s the weather in Kyoto this weekend?', d:2900 },
  { s:'thinking',  t:'', d:1150 },
  { s:'speaking',  t:'Saturday looks clear and mild \u2014 around 24 degrees. Sunday brings light rain after lunch.', d:6200 },
  { s:'asking',    t:'Want me to remind you to pack an umbrella?', d:4200 },
  { s:'listening', t:'Yes, please do.', d:1600 },
  { s:'speaking',  t:'Done \u2014 I\u2019ll nudge you Sunday morning.', d:3600 },
  { s:'idle',      t:'', d:1900 }
];

function App() {
  var st = React.useState({ s:'idle', t:'' }), cur = st[0], set = st[1];
  var manual = React.useRef(false);
  React.useEffect(function () {
    var i = 0, timer;
    function step() {
      if (manual.current) return;
      var k = SCRIPT[i % SCRIPT.length];
      set({ s:k.s, t:k.t });
      timer = setTimeout(function(){ i++; step(); }, k.d);
    }
    step();
    return function(){ clearTimeout(timer); };
  }, []);
  function pin(s, t) { manual.current = true; set({ s:s, t:t }); }
  var states = ['idle','listening','thinking','speaking','asking'];
  var copy = {
    idle:'', listening:'Go ahead \u2014 I\u2019m listening.', thinking:'',
    speaking:'Here\u2019s what I found \u2014 three flights leave before noon, and the cheapest is the 9:40.',
    asking:'Should I hold the 9:40 for you?'
  };
  return React.createElement('div', { className:'panel' },
    React.createElement(VoiceMascot, { state:cur.s, text:cur.t, spriteSrc:'hi-body.png' }),
    React.createElement('div', { className:'chips' }, states.map(function(s){
      return React.createElement('button', {
        key:s, 'data-on': cur.s === s ? '1' : '0',
        onClick: function(){ pin(s, copy[s]); }
      }, s[0].toUpperCase() + s.slice(1));
    }))
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
